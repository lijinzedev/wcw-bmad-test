spring.datasource.url=jdbc:postgresql://localhost:5432/bprev
spring.datasource.username=bprev_user
spring.datasource.password=bprev_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always

# JWT settings (demo defaults; rotate/change for production)
security.jwt.secret=changeme-dev-secret-key-please-rotate
security.jwt.expiration-ms=3600000

# MinIO storage defaults (override in env per deployment)
storage.minio.endpoint=
storage.minio.access-key=
storage.minio.secret-key=
storage.minio.bucket=hazard-uploads
storage.minio.secure=false
storage.minio.public-url=
